<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muckup - Carrito</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <h1> Muckup</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="carrito.html">Carrito (<span class="contador">0</span>)</a></li>
        <li><a href="contacto.html">Contacto</a></li>
        <li><a href="login.html">Ingresar</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Tu carrito</h2>
      <section class="carrito-scroll">
        <table>
          <thead>
            <tr><th>Producto</th><th>Precio</th><th>Cant.</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody id="cuerpo-carrito"></tbody>
        </table>
      </section>
      <p class="total">Total: <span id="total">$0.00</span></p>
    </section>

    <form class="formulario" id="form-pago">
      <h2>Pago con tarjetaa</h2>

      <label for="titular">Nombre de la persona</label>
      <input type="text" id="titular" placeholder="Como aparece en la tarjeta" required>

      <label for="tarjeta">Número de tarjeta</label>
      <input type="text" id="tarjeta" inputmode="numeric" placeholder="16 dígitos"
             pattern="[0-9]{16}" title="Escribe 16 números, sin espacios" required>

      <label for="vence">Vencimiento</label>
      <input type="text" id="vence" placeholder="MM/AA"
             pattern="(0[1-9]|1[0-2])\/[0-9]{2}" title="Formato MM/AA, por ejemplo 08/28" required>

      <label for="cvv">CVV</label>
      <input type="password" id="cvv" inputmode="numeric" placeholder="3 dígitos"
             pattern="[0-9]{3}" title="Escribe 3 números" required>

      <button type="submit" class="btn">Pagar</button>
    </form>
  </main>

  <footer>
    <address>Muckup · Santa Tecla, La Libertad · info@Muckup.com</address>
    <p>&copy; 2026Muckup. </p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
